name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      # No DATABASE_URL. v0 wired `secrets.DATABASE_URL` in here, which implied the
      # suite talked to a real database — it never did, and a fork without that
      # secret would have run with an empty string and been none the wiser.
      # Testcontainers-backed integration tests arrive in Phase 8; until then this
      # job is deliberately dependency-free, which is why it takes seconds.
      LOG_LEVEL: error
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:22-alpine.
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Coverage is opt-in now (jest.config.mjs sets collectCoverage: false), so it
      # is requested explicitly here rather than being written on every local run
      # into a directory that used to be tracked in git (finding F-01).
      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate test summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ] || [ -f coverage/coverage-final.json ]; then
            {
              echo "## Test coverage"
              echo ""
              echo "Reported, not enforced. Thresholds land in Phase 8 with the"
              echo "Testcontainers suite, where the number will mean something —"
              echo "a threshold pinned to today's figure is a ratchet, not a standard."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Test results"
              echo ""
              echo "No coverage report was produced."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
