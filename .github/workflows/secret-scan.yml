name: Secret Scan

# Phase 0 gate. A live Neon connection string was committed in 4d0ae6e and
# removed in fdc5df3 — the credential has since been rotated, but the string is
# still readable in history. This workflow makes a repeat impossible.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: we want to detect secrets in past commits, not just the diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No continue-on-error here. A secret in the diff fails the build.
          args: detect --redact --verbose --config .gitleaks.toml

      - name: Explain failure
        if: failure()
        run: |
          echo "## Secret scan failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "gitleaks found a credential-shaped string." >> $GITHUB_STEP_SUMMARY
          echo "1. Rotate the credential immediately — assume it is compromised." >> $GITHUB_STEP_SUMMARY
          echo "2. Remove it from the working tree and use an env var." >> $GITHUB_STEP_SUMMARY
          echo "3. If it is a false positive, add a narrow allowlist entry to .gitleaks.toml." >> $GITHUB_STEP_SUMMARY
