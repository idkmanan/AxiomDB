# =============================================================================
# Kafka, single-node KRaft.
# =============================================================================
# ONE BROKER, REPLICATION FACTOR 1, AND SAYING SO OUT LOUD. `acks: all` in
# src/events/kafka.js waits for every in-sync replica; with one replica that is one disk.
# The producer setting is correct and the durability it buys is a property of the cluster,
# so "we publish with acks=all" is only half a claim unless the replica count comes with it.
# A real cluster is three brokers with replication factor 3 and min.insync.replicas=2, which
# is a change to this file and to `scripts/events/topics.mjs --replication 3`, not to any
# application code.
#
# KRaft rather than ZooKeeper: fewer moving parts, and ZooKeeper is removed in Kafka 4.x, so
# a template that still deploys it is teaching something with a deprecation date.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: acquisitions
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: acquisitions
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - name: KAFKA_NODE_ID
              value: '1'
            - name: KAFKA_PROCESS_ROLES
              value: 'broker,controller'
            # The advertised listener must be the address CLIENTS can resolve, and inside the
            # cluster that is the pod's stable DNS name via the headless Service. Advertising
            # `localhost` here is the classic mistake: the broker accepts the connection, hands back
            # `localhost:9092` as the leader, and every client then talks to itself.
            - name: KAFKA_LISTENERS
              value: 'PLAINTEXT://:9092,CONTROLLER://:9093'
            - name: KAFKA_ADVERTISED_LISTENERS
              value: 'PLAINTEXT://kafka-0.kafka.acquisitions.svc.cluster.local:9092'
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: '1@kafka-0.kafka.acquisitions.svc.cluster.local:9093'
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: 'CONTROLLER'
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: 'PLAINTEXT'
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: '1'
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: '0'
            # Off, so a typo in a topic name fails instead of silently creating a one-partition
            # topic. Topics come from scripts/events/topics.mjs.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: 'false'
            - name: CLUSTER_ID
              value: 'acq-k8s-kraft-cluster'
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
          readinessProbe:
            # Metadata, not a TCP check. The broker listens well before it can serve a topic list,
            # and a readiness probe that only proves the port is open lets the workers start,
            # fail, and crash-loop while the broker is still coming up.
            exec:
              command:
                - sh
                - -c
                - '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: '250m', memory: '512Mi' }
            limits: { cpu: '1', memory: '1Gi' }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: data
          emptyDir: {}
---
# -----------------------------------------------------------------------------
# Topic creation as a Job, not as auto-creation.
#
# Runs to completion once, and is idempotent: scripts/events/topics.mjs checks what exists
# before creating anything, so a re-apply after a failed rollout is safe.
# -----------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: acquisitions
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: acquisitions:local
          imagePullPolicy: IfNotPresent
          command: ['node', 'scripts/events/topics.mjs', '--partitions', '3', '--replication', '1']
          envFrom:
            - configMapRef:
                name: acquisitions-config
            - secretRef:
                name: acquisitions-secrets
          resources:
            requests: { cpu: '50m', memory: '64Mi' }
            limits: { cpu: '250m', memory: '256Mi' }
